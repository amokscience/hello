apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: prod

bases:
  - ../../base

namePrefix: prod-

commonLabels:
  environment: production

images:
  - name: amokscience/hello
    newTag: prod-b257e8919f33da56126bb47a344d9a8bf56fcdef

patches:
  - target:
      kind: Deployment
      name: prod-hello-app
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 3
