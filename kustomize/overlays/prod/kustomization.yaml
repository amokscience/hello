apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: prod

bases:
  - ../../base

namePrefix: prod-

commonLabels:
  environment: production

images:
  - name: amokscience/hello
    newTag: prod-5ac87b0828cbe91773b54835e9bc34669a1d7aea

configMapGenerator:
  - name: hello-config
    literals:
      - environment=prod
      - hello=Hello from prod Kubernetes!

patches:
  - target:
      kind: Deployment
      name: hello-app
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 3
