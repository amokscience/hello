apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: prod

bases:
  - ../../base

namePrefix: prod-

commonLabels:
  environment: production

images:
  - name: amokscience/hello
    newTag: prod-38972526b40d0a3367e94710198bc5ac687dc218

patches:
  - target:
      kind: Deployment
      name: prod-hello-app
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 3
