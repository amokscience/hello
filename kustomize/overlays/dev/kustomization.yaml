apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: dev

bases:
  - ../../base

namePrefix: dev-

commonLabels:
  environment: development

images:
  - name: amokscience/hello
    newTag: dev-a752725f1bd4d72039a7922d9f9ed0e1b07d61f9

configMapGenerator:
  - name: hello-config
    literals:
      - environment=dev
      - hello=Hello from dev Kubernetes!

patches:
  - target:
      kind: Deployment
      name: hello-app
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 3
