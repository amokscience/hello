apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: dev

bases:
  - ../../base

namePrefix: dev-

commonLabels:
  environment: development

images:
  - name: amokscience/hello
    newTag: dev-8b31a40262617a6966f3a5c5eccfd8cc2e64a79a

configMapGenerator:
  - name: hello-config
    literals:
      - environment=dev
      - hello=Hello from dev Kubernetes!

patches:
  - target:
      kind: Deployment
      name: hello-app
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 3
