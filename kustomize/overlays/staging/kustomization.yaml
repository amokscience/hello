apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: staging

bases:
  - ../../base

namePrefix: staging-

commonLabels:
  environment: staging

images:
  - name: amokscience/hello
    newTag: staging-851f26b612e7bef70e365ed1de394f27fa61de05

configMapGenerator:
  - name: hello-config
    literals:
      - environment=staging
      - hello=Hello from staging Kubernetes!

patches:
  - target:
      kind: Deployment
      name: hello-app
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 3
