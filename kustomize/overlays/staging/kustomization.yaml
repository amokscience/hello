apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: staging

bases:
  - ../../base

namePrefix: staging-

commonLabels:
  environment: staging

images:
  - name: amokscience/hello
    newTag: staging-14c544baf49507413aa3db319ff31fb737549a14

patches:
  - target:
      kind: Deployment
      name: staging-hello-app
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 3
