apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: staging

bases:
  - ../../base

namePrefix: staging-

commonLabels:
  environment: staging

images:
  - name: amokscience/hello
    newTag: staging-3b1dec0bfb0b0eeb5bfdcef49b49294b7a2beab0

configMapGenerator:
  - name: hello-config
    literals:
      - environment=staging
      - hello=Hello from staging Kubernetes!

patches:
  - target:
      kind: Deployment
      name: hello-app
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 3
