apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: hello-staging

bases:
  - ../../base

namePrefix: staging-

commonLabels:
  environment: staging

patches:
  - target:
      kind: Deployment
      name: staging-hello-app
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
