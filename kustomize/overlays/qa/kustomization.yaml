apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: qa

bases:
  - ../../base

namePrefix: qa-

commonLabels:
  environment: qa

images:
  - name: amokscience/hello
    newTag: qa-a1b6937983952a726c05eeda04bb75474af1fcd8

patches:
  - target:
      kind: Deployment
      name: qa-hello-app
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 3
