apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: qa

bases:
  - ../../base

namePrefix: qa-

commonLabels:
  environment: qa

images:
  - name: amokscience/hello
    newTag: qa-9f0d7d26f5e41b0e9fe744caf04e5cca22ac1d3c

configMapGenerator:
  - name: hello-config
    literals:
      - environment=qa
      - hello=Hello from qa Kubernetes!

patches:
  - target:
      kind: Deployment
      name: hello-app
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 3
