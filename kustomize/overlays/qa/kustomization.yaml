apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: qa

bases:
  - ../../base

namePrefix: qa-

commonLabels:
  environment: qa

images:
  - name: amokscience/hello
    newTag: qa-b906e67cadb2a0ce17ccf8c893ee78860055998c

patches:
  - target:
      kind: Deployment
      name: hello-app
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 3
