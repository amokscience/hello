apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: hello-qa

bases:
  - ../../base

namePrefix: qa-

commonLabels:
  environment: qa

patches:
  - target:
      kind: Deployment
      name: qa-hello-app
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
