apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: qa

bases:
  - ../../base

namePrefix: qa-

commonLabels:
  environment: qa

images:
  - name: amokscience/hello
    newTag: qa-2f1a289abfbcc219263d5da5a4e7c36b145c08c9

patches:
  - target:
      kind: Deployment
      name: qa-hello-app
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 3
