apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: qa

bases:
  - ../../base

namePrefix: qa-

commonLabels:
  environment: qa

images:
  - name: amokscience/hello
    newTag: qa-3f40b2bb98c1c36885b829a8bb046aa7d7bf088d

configMapGenerator:
  - name: hello-config
    literals:
      - environment=qa
      - hello=Hello from qa Kubernetes!

patches:
  - target:
      kind: Deployment
      name: hello-app
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 3
