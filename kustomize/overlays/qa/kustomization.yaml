apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: hello-qa

bases:
  - ../../base

namePrefix: qa-

commonLabels:
  environment: qa

patches:
  - target:
      kind: Deployment
      name: qa-hello-app
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
      - op: replace
        path: /spec/template/spec/containers/0/env/1/value
        value: "qa"
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: "128Mi"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: "256Mi"
