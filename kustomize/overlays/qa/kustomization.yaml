apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: qa

bases:
  - ../../base

namePrefix: qa-

commonLabels:
  environment: qa

images:
  - name: amokscience/hello
    newTag: qa-ad0dcdd801164223b7689d3b5f5c8e4428c637a1

configMapGenerator:
  - name: hello-config
    literals:
      - environment=qa
      - hello=Hello from qa Kubernetes!

patches:
  - target:
      kind: Deployment
      name: hello-app
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 3
