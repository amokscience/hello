name: Build and Push Docker Image

on:
  push:
    branches: [ dev, qa, staging, prod, main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            amokscience/hello:${{ github.ref_name }}-latest
            amokscience/hello:${{ github.ref_name }}-${{ github.sha }}

      - name: Update Kustomize with new image SHA
        run: |
          BRANCH=${{ github.ref_name }}
          SHA=${{ github.sha }}
          
          if [ "$BRANCH" = "dev" ]; then
            sed -i "s/newTag: dev-.*/newTag: dev-${SHA:0:7}/" kustomize/overlays/dev/kustomization.yaml
          elif [ "$BRANCH" = "qa" ]; then
            sed -i "s/newTag: qa-.*/newTag: qa-${SHA:0:7}/" kustomize/overlays/qa/kustomization.yaml
          elif [ "$BRANCH" = "staging" ]; then
            sed -i "s/newTag: staging-.*/newTag: staging-${SHA:0:7}/" kustomize/overlays/staging/kustomization.yaml
          elif [ "$BRANCH" = "prod" ]; then
            sed -i "s/newTag: prod-.*/newTag: prod-${SHA:0:7}/" kustomize/overlays/prod/kustomization.yaml
          fi

      - name: Commit updated Kustomize manifests
        run: |
          git config user.email "github-actions@github.com"
          git config user.name "GitHub Actions"
          git add kustomize/
          git diff --cached --quiet || git commit -m "Update image SHA for ${{ github.ref_name }}: ${{ github.sha }}"
          git push origin ${{ github.ref_name }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  promote:
    needs: build
    runs-on: ubuntu-latest
    if: success()
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PAT }}

      - name: Configure Git
        run: |
          git config user.email "github-actions@github.com"
          git config user.name "GitHub Actions"

      - name: Promote dev to qa
        if: github.ref == 'refs/heads/dev'
        run: |
          git fetch origin
          git checkout qa
          git merge origin/dev --no-ff -m "Auto-promote from dev after successful build"
          git push origin qa
        continue-on-error: true

      - name: Promote qa to staging
        if: github.ref == 'refs/heads/qa'
        run: |
          git fetch origin
          git checkout staging
          git merge origin/qa --no-ff -m "Auto-promote from qa after successful build"
          git push origin staging
        continue-on-error: true

      - name: Promote staging to prod
        if: github.ref == 'refs/heads/staging'
        run: |
          git fetch origin
          git checkout prod
          git merge origin/staging --no-ff -m "Auto-promote from staging after successful build"
          git push origin prod
        continue-on-error: true
